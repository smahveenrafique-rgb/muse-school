<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · School AI Platform</title>
<link rel="stylesheet" href="/static/css/design.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brandmark">Arsalan Public School</div>
    <h1>School AI Platform</h1>
    {% if error %}<div class="banner error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="token">Admin token</label>
        <input type="password" id="token" name="token" autocomplete="current-password" required autofocus>
        <div class="hint">The ADMIN_API_TOKEN from the server's .env file.</div>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
